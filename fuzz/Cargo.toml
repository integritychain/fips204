[package]
name = "fips204-fuzz"
version = "0.5.0"
authors = ["Eric Schorn <eschorn@integritychain.com>"]
description = "Fuzz harness for FIPS 204 ML-DSA"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.85"


[package.metadata]
cargo-fuzz = true


[dependencies]
libfuzzer-sys = "0.4"
rand_core = { version = "0.9", default-features = false }
rand_chacha = "0.9"


[dependencies.fips204]
path = ".."


# Prevent this from interfering with workspaces
#[workspace]
#members = ["."]


[profile.release]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true


[[bin]]
name = "fuzz_all"
path = "fuzz_targets/fuzz_all.rs"
test = false
doc = false

[[bin]]
name = "fuzz_verify"
path = "fuzz_targets/fuzz_verify.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sign"
path = "fuzz_targets/fuzz_sign.rs"
test = false
doc = false
