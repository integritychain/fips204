[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fips204"
license = "MIT OR Apache-2.0"
dynamic = ["version"]
description = "ML-DSA (FIPS204) -- asymmetric, quantum-secure digital signatures"
authors = [{name = "Daniel Kahn Gillmor", email = "dkg@fifthhorseman.net"}]
keywords = [
 "cryptography",
 "signing",
 "FIPS",
 "FIPS204",
 "DSA",
 "lattice",
 "module-lattice",
 "post-quantum",
]
# README.md duplicates the module docstring.
# I do not know how to keep them automatically in sync
readme = "README.md"
requires-python = ">=3.9"
# only dependencies are having the libfips204 shared object available
# everything else is from the stdlib
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Telecommunications Industry",
  "Intended Audience :: Information Technology",
  "Topic :: Security :: Cryptography",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/integritychain/fips204/tree/main/ffi/python"
Repository = "https://github.com/integritychain/fips204.git"
Issues = "https://github.com/integritychain/fips204/issues"

[tool.setuptools.dynamic]
version = {attr = "fips204.__version__"}
