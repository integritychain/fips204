# rustfmt settings shared by fips203, fips204 and fips205. Some options are unstable, so format
# with nightly: `cargo +nightly fmt --all`, here and in each separately built crate.
edition = "2021"

# Dense layout at the default max_width (100): the width heuristics use the whole line, except
# that function calls and struct literals break earlier.
use_small_heuristics = "Max"
fn_call_width = 80
struct_lit_width = 60
short_array_element_width_threshold = 24
overflow_delimited_expr = true
fn_params_layout = "Compressed"
fn_single_line = true

format_code_in_doc_comments = true
blank_lines_upper_bound = 2
