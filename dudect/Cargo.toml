[package]
name = "fips204-dudect"
version = "0.5.0"
authors = ["Eric Schorn <eschorn@integritychain.com>"]
description = "Dudect testbench for FIPS 204 ML-DSA"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.85"


[dependencies]
fips204 = { path = "..", default-features = false, features = ["dudect", "ml-dsa-44"] }
# Vendored 0.6 patched for rand 0.9 so the tree has a single rand_core (not 0.6+0.9)
dudect-bencher = { path = "vendor/dudect-bencher" }
rand_core = { version = "0.9", default-features = false }


[profile.bench]
debug = true
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
codegen-units = 1


[profile.release]
debug = true
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
codegen-units = 1
